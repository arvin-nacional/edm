<!-- =============================================
     SECTION: The Executive Question
     KauSAP CIO Partner Exchange with Diligent
     ============================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; }
  * { box-sizing: border-box; }

  :root {
    --navy:        #1e3a8a;
    --navy-mid:    #1e40af;
    --gold:        #e8a020;
    --gold-pale:   #fffbea;
    --white:       #ffffff;
    --text-dark:   #0f172a;
    --text-mid:    #334155;
    --text-muted:  #64748b;
  }


  /* ── EXECUTIVE QUESTION ── */
  .exec-question {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    padding: 88px 0;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .exec-question::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(232,160,32,0.05)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
    opacity: .3;
  }

  .exec-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .section-tag {
    display: inline-block; font-size: .78rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1.2rem;
  }

  .exec-question-text {
    font-size: clamp(1.3rem, 3vw, 1.9rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1.5;
    margin-bottom: 1.5rem;
  }

  .exec-answer {
    font-size: 1.05rem;
    font-weight: 500;
    color: rgba(255,255,255,.85);
    line-height: 1.7;
    font-style: italic;
  }

  .exec-cta {
    margin-top: 2.5rem;
    font-size: .95rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: .02em;
  }

  @media (max-width: 640px) {
    .exec-question { padding: 48px 0; }
    .exec-question-text { font-size: 1.15rem; }
    .exec-answer { font-size: .92rem; }
    .exec-cta { font-size: .88rem; margin-top: 2rem; }
  }
</style>

<div style="width:100%;overflow:hidden;">
<section class="exec-question">
  <div class="exec-inner">
    
    <span class="section-tag">The Executive Question</span>
    
    <p class="exec-question-text">
      Of the five questions worth asking any SAP vendor, which one would your current partner struggle to answer with data rather than positioning?
    </p>

    <p class="exec-answer">
      That&rsquo;s where the conversation begins.
    </p>

    <p class="exec-cta">
      Join us to explore what matters most.
    </p>

  </div>
</section>
</div>
