<!-- =============================================
     SECTION: Who Should Attend
     SSI - Secure the Foundation. Orchestrate the Future.
     ============================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --navy:        #001141;
    --navy-mid:    #0a1f5c;
    --blue:        #0f62fe;
    --blue-pale:   #e8f0fe;
    --white:       #ffffff;
    --text-dark:   #0f172a;
    --text-mid:    #334155;
    --text-muted:  #64748b;
    --border:      #e2e8f0;
    --section-alt: #f8fafc;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--white); color: var(--text-dark); line-height: 1.6;
  }

  /* ── WHO SHOULD ATTEND ── */
  .who-attend {
    background: var(--white);
    padding: 88px 0;
  }

  .who-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px;
    text-align: center;
  }

  .section-tag {
    display: inline-block; font-size: .78rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--blue); margin-bottom: .8rem;
  }

  .section-title {
    font-size: clamp(1.7rem, 3.5vw, 2.6rem); font-weight: 800;
    color: var(--navy); letter-spacing: -.5px; line-height: 1.2;
    margin-bottom: .8rem;
  }

  .section-sub {
    font-size: .95rem;
    color: var(--text-muted);
    margin-bottom: 2.8rem;
  }

  /* Pills grid */
  .who-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
  }

  .who-pill {
    display: flex;
    align-items: center;
    gap: .65rem;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 100px;
    padding: .7rem 1.4rem;
    transition: transform .18s, box-shadow .18s, border-color .18s, background .18s;
    cursor: default;
  }

  .who-pill:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(15,98,254,.12);
    border-color: var(--blue);
    background: var(--blue-pale);
  }

  .who-pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    flex-shrink: 0;
  }

  .who-pill span {
    font-size: .92rem;
    font-weight: 600;
    color: var(--navy);
  }

  @media (max-width: 600px) {
    .who-attend { padding: 48px 0; }
    .section-title { font-size: 1.4rem; }
    .section-sub { margin-bottom: 2rem; }
    .who-pill { padding: .55rem 1rem; }
    .who-pill span { font-size: .82rem; }
    .who-pill-dot { width: 6px; height: 6px; }
  }
</style>

<!-- WHO SHOULD ATTEND SECTION -->
<section class="who-attend">
  <div class="who-inner">
    <span class="section-tag">Audience</span>
    <h2 class="section-title">Who Should Attend</h2>
    <p class="section-sub">This event is designed for:</p>

    <div class="who-grid">
      <div class="who-pill"><div class="who-pill-dot"></div><span>CIOs and CTOs</span></div>
      <div class="who-pill"><div class="who-pill-dot"></div><span>CISOs and Security Leaders</span></div>
      <div class="who-pill"><div class="who-pill-dot"></div><span>IT Directors and Managers</span></div>
      <div class="who-pill"><div class="who-pill-dot"></div><span>Infrastructure &amp; Operations Leaders</span></div>
      <div class="who-pill"><div class="who-pill-dot"></div><span>Enterprise Architects</span></div>
      <div class="who-pill"><div class="who-pill-dot"></div><span>DevOps / DevSecOps Leaders</span></div>
      <div class="who-pill"><div class="who-pill-dot"></div><span>Digital Transformation Leaders</span></div>
      <div class="who-pill"><div class="who-pill-dot"></div><span>Business and Technology Decision Makers</span></div>
    </div>

  </div>
</section>
